<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kelulusan SMA NEGERI 2 MAGETAN</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      text-align: center;
      padding: 30px;
    }
    .login-box {
      background: #fff;
      padding: 30px;
      margin: auto;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 300px;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
    }
    button {
      background: #2e86de;
      color: white;
      border: none;
    }
    .result {
      margin-top: 20px;
      font-size: 18px;
    }
    .canva-embed {
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Pengumuman Kelulusan</h2>
    <p>SMA NEGERI 2 MAGETAN</p>
    <input type="text" id="nis" placeholder="Masukkan NIS">
    <button onclick="checkGraduation()">Cek Kelulusan</button>
    <div class="result" id="result"></div>
  </div>

  <div class="canva-embed">
    <div style="position: relative; width: 100%; max-width: 600px; margin: auto; height: 0; padding-top: 56.2225%;
      box-shadow: 0 2px 8px 0 rgba(63,69,81,0.16); border-radius: 8px; overflow: hidden;">
      <iframe loading="lazy" style="position: absolute; width: 100%; height: 100%; top: 0; left: 0; border: none;"
        src="https://www.canva.com/design/DAGmNwNI7lI/l1-xlvu0yIq78gJnEZmfeA/view?embed" allowfullscreen>
      </iframe>
    </div>
    <p><a href="https://www.canva.com/design/DAGmNwNI7lI/l1-xlvu0yIq78gJnEZmfeA/view?utm_content=DAGmNwNI7lI&utm_campaign=designshare&utm_medium=embeds&utm_source=link"
      target="_blank" rel="noopener">Sosialisasi Pelepasan Siswa</a></p>
  </div>

  <script>
    const dataSiswa = {
      "220101": { nama: "Ahmad Rafi", lulus: true },
      "220102": { nama: "Siti Aminah", lulus: true },
      "220103": { nama: "Budi Santoso", lulus: false }
    };

    function checkGraduation() {
      const nis = document.getElementById("nis").value.trim();
      const resultDiv = document.getElementById("result");

      if (dataSiswa[nis]) {
        const siswa = dataSiswa[nis];
        resultDiv.innerHTML = `
          Nama: <strong>${siswa.nama}</strong><br>
          Status Kelulusan: <strong style="color: ${siswa.lulus ? 'green' : 'red'}">
            ${siswa.lulus ? 'LULUS' : 'TIDAK LULUS'}
          </strong>
        `;
      } else {
        resultDiv.innerHTML = `<span style="color: red;">NIS tidak ditemukan.</span>`;
      }
    }
  </script>
</body>
</html>
