<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kelulusan SMA NEGERI 2 MAGETAN</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .background-iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      border: none;
      pointer-events: none;
    }

    .overlay {
      position: relative;
      width: 100%;
      height: 100%;
      background-color: rgba(255, 255, 255, 0.9); /* membuat teks tetap jelas */
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-box {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 300px;
      text-align: center;
    }

    input, button {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      background: #2e86de;
      color: white;
      border: none;
      cursor: pointer;
    }

    .result {
      margin-top: 20px;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <!-- Canva sebagai background -->
  <iframe class="background-iframe" src="https://www.canva.com/design/DAGmNwNI7lI/l1-xlvu0yIq78gJnEZmfeA/view?embed" allowfullscreen></iframe>

  <div class="overlay">
    <div class="login-box">
      <h2>Pengumuman Kelulusan</h2>
      <p>SMA NEGERI 2 MAGETAN</p>
      <input type="text" id="nis" placeholder="Masukkan NIS">
      <button onclick="checkGraduation()">Cek Kelulusan</button>
      <div class="result" id="result"></div>
    </div>
  </div>

  <script>
    const dataSiswa = {
      "220101": { nama: "Ahmad Rafi", lulus: true },
      "220102": { nama: "Siti Aminah", lulus: true },
      "220103": { nama: "Budi Santoso", lulus: false }
    };

    function checkGraduation() {
      const nis = document.getElementById("nis").value.trim();
      const resultDiv = document.getElementById("result");

      if (dataSiswa[nis]) {
        const siswa = dataSiswa[nis];
        resultDiv.innerHTML = `
          Nama: <strong>${siswa.nama}</strong><br>
          Status Kelulusan: <strong style="color: ${siswa.lulus ? 'green' : 'red'}">
            ${siswa.lulus ? 'LULUS' : 'TIDAK LULUS'}
          </strong>
        `;
      } else {
        resultDiv.innerHTML = `<span style="color: red;">NIS tidak ditemukan.</span>`;
      }
    }
  </script>

</body>
</html>
